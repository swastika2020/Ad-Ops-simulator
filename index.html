function hintTxt(){return V.v==='home'?'Press Start and I will guide you through every step.':V.v==='map'?'Pick the open mission. Locked ones open when you clear the one before.':V.v==='play'?HN[V.st]:V.v==='live'?'Watch CPA against the target. Pause & Tweak lets you change your bid.':V.v==='res'?(V.res&&V.res.pass?'Passed! Check "What changes" for the next mission and copy its new funding code from the brief.':'Read what drove the result, then fix the biggest problem first.'):'Your certificate is ready.'}
function bot(){var k=V.v==='play'?'s'+V.st:V.v;if(V.hk!==k){V.hk=k;V.help=false;V.ans='';if(!S.seen[k]&&!V.modal){S.seen[k]=1;V.help=true;sv()}}
return`<div class="bot ${V.help?'open':''}"><div class="bub"><button class="x" onclick="V.help=false;rn()" aria-label="Close hint">×</button><b>Coach</b><p class="s" style="margin:4px 0 0">${hintTxt()}</p><p class="s" style="margin:8px 0 0">${V.ans||''}</p><input aria-label="Ask the coach" placeholder="Ask about this mission, then press Enter" onkeydown="if(event.key==='Enter'&&this.value.trim())ask(this.value)"></div><button class="mas" onclick="V.help=!V.help;rn()" aria-label="Open coach hint"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#1d4ed8"/><rect x="11" y="14" width="26" height="20" rx="8" fill="#fff"/><circle cx="19" cy="23" r="3" fill="#14203a"/><circle cx="29" cy="23" r="3" fill="#14203a"/><path d="M19 29q5 4 10 0" stroke="#14203a" stroke-width="2" fill="none"/></svg></button></div>`}
function modalHTML(){if(V.modal==='win'){var n=S.at[V.i]||1;return`<div class="md"><div style="text-align:center"><div class="cup">🏆</div><div class="sw">${[1,2,3].map(k=>`<span class="${k<=S.st[V.i]?'on':''}">★</span>`).join('')}</div><h2>${E(LV[V.i].n)} cleared</h2><p class="m s">${n===1?'Passed on the first attempt: 3 stars.':'Passed on attempt '+n+': stars are based on first-clear attempts (1 try 3, 2 tries 2, 3+ tries 1).'}</p><p style="font-size:28px;margin:0 0 10px">👏 👏 👏</p><button class="btn" onclick="V.modal='';rn()">See my report</button></div></div>`}if(V.modal==='welcome')return`<div class="md"><div><h2>Welcome, ad manager</h2><p class="m">You will run campaigns for 10 clients and climb four ranks to Digital Ad Tycoon.</p><ol class="s"><li>Read the client brief.</li><li>Build the campaign in 9 steps.</li><li>Launch, watch the numbers and beat the target CPA.</li></ol><p class="s m">I'm the Coach in the corner. Tap me any time for a hint.</p><button class="btn" onclick="S.seen.w=1;sv();V.modal='';play(V.go)">Let's go</button></div></div>`;
 if(V.modal==='war')return`<div class="md"><div><p class="s" style="color:var(--r);font-weight:700;margin:0">BID WAR</p><h2>A rival is bidding on your keywords</h2><p class="m">Raise bids by at least 15% to defend your position, or your costs will spike and traffic will drop.</p><div class="row"><button class="btn" onclick="wr(1.2)">Raise bids +20%</button><button class="btn o" onclick="wr(1)">Hold bids</button></div></div></div>`;return''}
function wr(a){V.C.adj=a;V.live.pz=false;V.modal='';rn()}
document.addEventListener('mousemove',e=>{var s=$('#sc');if(s){s.style.setProperty('--rx',((e.clientX/innerWidth-.5)*16)+'deg');s.style.setProperty('--ry',((e.clientY/innerHeight-.5)*-12)+'deg')}});
function fh(h){return h===0||h===24?'12am':h<12?h+'am':h===12?'12pm':(h-12)+'pm'}
function hrL(L){return L.h0===0&&L.h1===24?'24/7':fh(L.h0)+'–'+fh(L.h1)}
function aovOpts(L){return [Math.round(L.val*.4),L.val,Math.round(L.val*2.2),Math.round(L.val*4)].sort((a,b)=>a-b)}
function hrOpts(L){var c=hrL(L);return ['24/7','9am–5pm','8am–8pm','7am–9pm','6am–10pm','9am–6pm'].filter(x=>x!==c).slice(0,3).concat(c).sort()}
function facts(L){return ['Budget $'+L.bud,L.days+'-day flight (about $'+R(L.bud/L.days)+'/day)','Target CPA $'+L.t,L.cat+' · '+L.mod]}
function briefFull(L){return L.br+' Customers are '+(L.mod==='B2B'?'other businesses':'consumers')+', '+(L.cat==='Service area'?'served within a local area':'ordering online')+'. A typical order is worth about $'+L.val+'. Hours: '+hrL(L)+'.'}
function chg(i){var a=LV[i-1],b=LV[i],c=[];if(a.goal!==b.goal)c.push('Goal: '+GOALS[a.goal]+' → <b>'+GOALS[b.goal]+'</b>');if(a.ch!==b.ch)c.push('Best channel: '+CHS[a.ch]+' → <b>'+CHS[b.ch]+'</b>');if(a.rad!==b.rad)c.push('Geography: '+RADS[a.rad]+' → <b>'+RADS[b.rad]+'</b>');if(hrL(a)!==hrL(b))c.push('Hours: '+hrL(a)+' → <b>'+hrL(b)+'</b> (set dayparting to match)');if(a.val!==b.val)c.push('Order value: $'+a.val+' → <b>$'+b.val+'</b>');if(a.mod!==b.mod)c.push('Customers: '+a.mod+' → <b>'+b.mod+'</b>');if(a.cat!==b.cat)c.push('Business type: '+a.cat+' → <b>'+b.cat+'</b>');if(a.days!==b.days)c.push('Flight: '+a.days+' → <b>'+b.days+' days</b>');c.push('Budget $'+a.bud+' → <b>$'+b.bud+'</b> · target CPA $'+a.t+' → <b>$'+b.t+'</b>');c.push('<b>New funding code</b>: copy it from the brief again');if(b.war)c.push('<b>Bid war</b> mid-flight: be ready to raise bids');return c}
function chgCard(i){return'<div class="card chg"><b>What changes in mission '+(i+1)+'</b><ul>'+chg(i).map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'}
function stars(i){var n=S.st&&S.st[i]||0;return'★★★'.slice(0,n)+'☆☆☆'.slice(n)}
function chain(i){return'<div class="chain">'+LV.map((x,k)=>'<span class="lk '+(S.cl[k]!==undefined?'ok':k===i+1?'nx':'')+'">'+(k+1)+'</span>'+(k<9?'<s class="'+(S.cl[k]!==undefined&&k===i?'go':S.cl[k]!==undefined?'ok':'')+'"></s>':'')).join('')+'</div>'}
function cdChk(v){var L=LV[V.i];V.C.code=v.replace(/\s/g,'').toUpperCase();var e=$('#cs');if(e)e.innerHTML=V.C.code?(V.C.code===L.code?'<span class="good">Code accepted.</span>':'<span class="bad">Code does not match.</span>'):'';var n=$('#nx');if(n)n.disabled=!ok(7,L,V.C)}
var AC;function snd(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;[523,659,784,1047].forEach((f,i)=>{var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,t+i*.14);g.gain.exponentialRampToValueAtTime(.12,t+i*.14+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.14+.3);o.connect(g);g.connect(AC.destination);o.start(t+i*.14);o.stop(t+i*.14+.32)});for(var k=0;k<14;k++){var b=AC.createBuffer(1,2205,44100),d=b.getChannelData(0);for(var j=0;j<2205;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/2205,3);var s=AC.createBufferSource(),g2=AC.createGain();g2.gain.value=.25;s.buffer=b;s.connect(g2);g2.connect(AC.destination);s.start(t+.7+k*.11+Math.random()*.05)}}catch(e){}}
function boom(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var h='<span class="pp" style="left:6%">🎉</span><span class="pp" style="right:6%">🎉</span>';for(var i=0;i<50;i++)h+='<i class="cf" style="left:'+Math.random()*100+'%;background:'+['#1d4ed8','#6d3fd6','#0f766e','#d4a017'][i%4]+';animation-delay:'+Math.random()*.6+'s"></i>';var d=document.createElement('div');d.innerHTML=h;document.body.appendChild(d);setTimeout(function(){d.remove()},3600)}
function party(){V.modal='win';rn();boom();snd()}
function ask(q){var L=LV[V.i],t=q.toLowerCase(),m=function(){return[].slice.call(arguments).some(x=>t.includes(x))},a;
 if(m('code','fund','billing','copy','authori','paste'))a='Funding code for this mission: <b>'+L.code+'</b>. Copy it in Step 1 and paste it at Billing (Step 8). Every mission has a new code.';
 else if(m('next','change','after','upcoming'))a=V.i<9?'Mission '+(V.i+2)+' changes: '+chg(V.i+1).slice(0,4).join('; '):'This is the final mission. The certificate comes after it.';
 else if(m('budget','cost','duration','days','long','spend'))a='Budget $'+L.bud+' over '+L.days+' days (about $'+R(L.bud/L.days)+' a day). Target CPA $'+L.t+'.';
 else if(m('order','value','aov','worth'))a='A typical order here is about $'+L.val+'. If your CPA is above that, the client loses money.';
 else if(m('hour','open','daypart','schedule','time'))a='Open hours: '+hrL(L)+'. Set dayparting to match so no ads run when they are closed.';
 else if(m('keyword','negative','broad','exact'))a='Block irrelevant searches (jobs, free, how to) as Negative. Exact is tight and high intent. Broad brings volume but also junk.';
 else if(m('quality','headline','creative','copy'))a='Use your keywords in the headlines and match the call to action to the goal. That raises Quality Score and cuts CPC.';
 else if(m('bid','cpa','target'))a='Maximize Conversions suits leads. Target CPA needs a realistic number. This mission targets $'+L.t+'.';
 else if(m('goal','channel'))a='Match the goal to how this client earns: enquiries mean Leads, checkout means Sales. Pick the channel where buyers already search.';
 else a='I can help with: the funding code, budget and days, order value, opening hours, keywords, quality score, bidding, or what changes in the next mission.';
 V.ans=a;V.help=true;rn()}
